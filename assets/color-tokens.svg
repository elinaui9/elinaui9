<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="t d">
  <title id="t">Elina's color tokens</title>
  <desc id="d">Five color tokens: Deep Black #050505, Soft Black #11100E, Marble White #F4F2ED, Warm Cream #D8CBB7, Stone Cream #9C8E7B.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11100E"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .name { fill:#F4F2ED; font-size:14px; font-weight:600; }
      .hex { fill:#9C8E7B; font-size:11px; }
      .sw { transform-box: fill-box; transform-origin: bottom; animation: pop 7s cubic-bezier(.2,.8,.2,1) infinite; }
      @keyframes pop { 0% { transform: scaleY(.12); opacity:.2 } 12%, 88% { transform: scaleY(1); opacity:1 } 100% { transform: scaleY(.12); opacity:.2 } }
      .c2 { animation-delay:.1s } .c3 { animation-delay:.2s } .c4 { animation-delay:.3s } .c5 { animation-delay:.4s }
      .ring { animation: ring 7s ease-in-out infinite; }
      @keyframes ring { 0%, 20% { stroke-opacity:0 } 40%, 80% { stroke-opacity:1 } 100% { stroke-opacity:0 } }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="198" rx="20" fill="url(#bg)" stroke="rgba(244,242,237,.10)"/>
  <text x="36" y="40" class="mono" fill="#D8CBB7" font-size="12" letter-spacing="2.4">◆ COLOR TOKENS</text>
  <text x="864" y="40" class="mono" fill="#9C8E7B" font-size="11" text-anchor="end">black · white · cream</text>

  <g stroke="rgba(244,242,237,.18)">
    <rect class="sw"    x="36"  y="58" width="152" height="72" rx="12" fill="#050505"/>
    <rect class="sw c2" x="204" y="58" width="152" height="72" rx="12" fill="#11100E"/>
    <rect class="sw c3" x="372" y="58" width="152" height="72" rx="12" fill="#F4F2ED" stroke="none"/>
    <rect class="sw c4" x="540" y="58" width="152" height="72" rx="12" fill="#D8CBB7" stroke="none"/>
    <rect class="sw c5" x="708" y="58" width="156" height="72" rx="12" fill="#9C8E7B" stroke="none"/>
  </g>
  <!-- primary marker -->
  <rect class="ring" x="535" y="53" width="162" height="82" rx="15" fill="none" stroke="#F4F2ED" stroke-width="1.5" stroke-dasharray="4 3"/>

  <g>
    <text x="38"  y="156" class="sans name">Deep Black</text><text x="38"  y="174" class="mono hex">#050505</text>
    <text x="206" y="156" class="sans name">Soft Black</text><text x="206" y="174" class="mono hex">#11100E</text>
    <text x="374" y="156" class="sans name">Marble White</text><text x="374" y="174" class="mono hex">#F4F2ED</text>
    <text x="542" y="156" class="sans name">Warm Cream ★</text><text x="542" y="174" class="mono hex">#D8CBB7</text>
    <text x="710" y="156" class="sans name">Stone Cream</text><text x="710" y="174" class="mono hex">#9C8E7B</text>
  </g>
</svg>
