<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="t d">
  <title id="t">Elina hero</title>
  <desc id="d">An animated design canvas in purple: a pen-tool curve draws itself, a selected shape with resize handles, a cursor gliding across, and floating UI shapes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1230"/>
      <stop offset=".55" stop-color="#120C1F"/>
      <stop offset="1" stop-color="#0C0814"/>
    </linearGradient>
    <radialGradient id="blobA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity=".35"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" x2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="fillA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#3B2D5C"/>
    </pattern>
    <clipPath id="clip"><rect width="900" height="280" rx="24"/></clipPath>
    <style>
      .draw { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 8s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes draw { 0% { stroke-dashoffset:1100 } 45%, 85% { stroke-dashoffset:0 } 100% { stroke-dashoffset:-1100 } }
      .anchor { fill:#0C0814; stroke:#C4B5FD; stroke-width:1.6; opacity:0; animation: pop 8s infinite; }
      .a2 { animation-delay:.9s } .a3 { animation-delay:1.8s } .a4 { animation-delay:2.7s }
      @keyframes pop { 0%,4% { opacity:0 } 10%,80% { opacity:1 } 90%,100% { opacity:0 } }
      .handle { stroke:#8B5CF6; stroke-width:1; opacity:0; animation: pop 8s infinite; }
      .float1 { animation: f1 7s ease-in-out infinite; }
      .float2 { animation: f2 9s ease-in-out infinite; }
      .float3 { animation: f1 11s ease-in-out infinite reverse; }
      @keyframes f1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(0,-10px) } }
      @keyframes f2 { 0%,100% { transform: translate(0,0) rotate(0deg) } 50% { transform: translate(6px,8px) rotate(8deg) } }
      .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .sel { transform-box: fill-box; transform-origin: center; animation: resize 6s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes resize { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12, 1.05) } }
      .blink { animation: blink 1.4s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0 } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#dots)" opacity=".7"/>

    <!-- ambient glow -->
    <ellipse cx="180" cy="60" rx="260" ry="160" fill="url(#blobA)">
      <animate attributeName="cx" values="180;240;180" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="760" cy="240" rx="240" ry="150" fill="url(#blobB)">
      <animate attributeName="cx" values="760;690;760" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <!-- layout guides -->
    <g stroke="#A78BFA" stroke-opacity=".14" stroke-dasharray="3 5">
      <path d="M0 140H900"/>
      <path d="M450 0V280"/>
    </g>

    <!-- pen tool curve -->
    <path d="M90 200 C 190 40, 300 40, 380 140 S 560 250, 640 130 S 780 40, 830 90"
          fill="none" stroke="url(#stroke)" stroke-width="3.5" stroke-linecap="round" class="draw"/>
    <g>
      <line x1="300" y1="80" x2="460" y2="200" class="handle a2"/>
      <circle cx="300" cy="80" r="3.5" fill="#8B5CF6" class="handle a2" style="stroke:none"/>
      <circle cx="460" cy="200" r="3.5" fill="#8B5CF6" class="handle a2" style="stroke:none"/>
      <line x1="580" y1="210" x2="700" y2="50" class="handle a3"/>
      <circle cx="580" cy="210" r="3.5" fill="#8B5CF6" class="handle a3" style="stroke:none"/>
      <circle cx="700" cy="50" r="3.5" fill="#8B5CF6" class="handle a3" style="stroke:none"/>
      <rect x="85" y="195" width="10" height="10" rx="2" class="anchor"/>
      <rect x="375" y="135" width="10" height="10" rx="2" class="anchor a2"/>
      <rect x="635" y="125" width="10" height="10" rx="2" class="anchor a3"/>
      <rect x="825" y="85" width="10" height="10" rx="2" class="anchor a4"/>
    </g>

    <!-- selected component with handles -->
    <g class="float1">
      <g class="sel">
        <rect x="470" y="40" width="150" height="74" rx="14" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".12"/>
        <circle cx="496" cy="66" r="11" fill="url(#fillA)"/>
        <rect x="516" y="58" width="74" height="7" rx="3.5" fill="#EDE9FE" opacity=".85"/>
        <rect x="516" y="71" width="50" height="6" rx="3" fill="#A78BFA" opacity=".5"/>
        <rect x="486" y="90" width="118" height="10" rx="5" fill="#7C3AED" opacity=".55"/>
        <rect x="464" y="34" width="162" height="86" fill="none" stroke="#A78BFA" stroke-width="1.2"/>
        <g fill="#0C0814" stroke="#A78BFA" stroke-width="1.2">
          <rect x="460" y="30" width="8" height="8"/><rect x="622" y="30" width="8" height="8"/>
          <rect x="460" y="116" width="8" height="8"/><rect x="622" y="116" width="8" height="8"/>
        </g>
      </g>
    </g>

    <!-- floating primitives -->
    <g class="float2">
      <rect x="150" y="196" width="54" height="54" rx="16" fill="url(#fillA)" opacity=".9"/>
      <rect x="150" y="196" width="54" height="54" rx="16" fill="url(#glass)"/>
    </g>
    <g class="float3">
      <circle cx="770" cy="196" r="26" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="6 6" class="spin"/>
      <circle cx="770" cy="196" r="12" fill="#A78BFA"/>
    </g>
    <g class="float1" style="animation-delay:-3s">
      <path d="M250 40 l18 32 h-36z" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linejoin="round" class="spin"/>
    </g>
    <g class="float2" style="animation-delay:-4s">
      <rect x="320" y="206" width="70" height="24" rx="12" fill="#1E1530" stroke="#4C3A73"/>
      <circle cx="334" cy="218" r="5" fill="#A78BFA"/>
      <rect x="346" y="215" width="34" height="6" rx="3" fill="#6B5F86"/>
    </g>

    <!-- swatches -->
    <g class="float3" style="animation-delay:-2s">
      <rect x="700" y="20" width="132" height="34" rx="17" fill="#1E1530" stroke="#3B2D5C"/>
      <circle cx="720" cy="37" r="9" fill="#EDE9FE"/>
      <circle cx="744" cy="37" r="9" fill="#C4B5FD"/>
      <circle cx="768" cy="37" r="9" fill="#A78BFA" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="792" cy="37" r="9" fill="#7C3AED"/>
      <circle cx="816" cy="37" r="9" fill="#4C1D95"/>
    </g>

    <!-- spacing redline -->
    <g stroke="#F472B6" stroke-width="1" opacity=".75">
      <path d="M470 128V150 M620 128V150 M470 139H620"/>
      <animate attributeName="opacity" values="0;0;.75;.75;0" keyTimes="0;.3;.4;.8;1" dur="6s" repeatCount="indefinite"/>
    </g>

    <!-- cursor -->
    <g>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;.3;.55;.8;1" keySplines=".6 0 .4 1;.6 0 .4 1;.6 0 .4 1;.6 0 .4 1"
        values="140,120; 520,100; 600,150; 360,180; 140,120"/>
      <path d="M0 0 L0 20 L5.5 15 L9 23 L12.5 21.5 L9 13.5 L16 13.5 Z" fill="#FFFFFF" stroke="#0C0814" stroke-width="1.2" stroke-linejoin="round"/>
      <rect x="16" y="20" width="12" height="12" rx="6" fill="#A78BFA" class="blink"/>
    </g>

    <!-- frame border -->
    <rect x=".5" y=".5" width="899" height="279" rx="24" fill="none" stroke="#A78BFA" stroke-opacity=".22"/>
  </g>
</svg>
